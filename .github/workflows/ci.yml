name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Configure disposable local instance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import secrets
          Path('.env').write_text('NEXTCLOUD_ADMIN_USER=songbook-ci\nNEXTCLOUD_ADMIN_PASSWORD=' + secrets.token_urlsafe(36) + '\nSONGBOOK_PORT=8081\n')
          Path('.env').chmod(0o600)
          PY
      - run: docker compose up -d --wait --wait-timeout 240 nextcloud
      - run: docker compose exec -T --user www-data nextcloud php occ app:enable songbook
      - run: python3 tests/integration/test_http.py
      - run: python3 tests/integration/test_library.py
      - name: Stop disposable instance
        if: always()
        run: docker compose down

  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer check-platform-reqs
      - run: composer audit
      - run: composer lint
      - run: composer test
      - name: Validate official app metadata
        run: |
          curl --fail --location https://apps.nextcloud.com/schema/apps/info.xsd --output /tmp/songbook-info.xsd
          php scripts/validate-metadata.php /tmp/songbook-info.xsd
