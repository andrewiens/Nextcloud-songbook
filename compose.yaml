name: songbook-dev

services:
  nextcloud:
    image: nextcloud:35-apache
    ports:
      - "127.0.0.1:${SONGBOOK_PORT:-8081}:80"
    environment:
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:?Set NEXTCLOUD_ADMIN_USER in .env}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?Set NEXTCLOUD_ADMIN_PASSWORD in .env}
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1"
      SQLITE_DATABASE: songbook-dev
    volumes:
      - nextcloud_dev:/var/www/html
      - ./:/var/www/html/custom_apps/songbook:ro
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=json_decode(@file_get_contents('http://localhost/status.php'),true); exit(($$s['installed']??false)&&!($$s['maintenance']??true)?0:1);"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

  node:
    image: node:24-bookworm-slim
    profiles: [tools]
    working_dir: /app
    volumes:
      - ./:/app
    entrypoint: [npm]

  composer:
    image: composer:2
    profiles: [tools]
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
    entrypoint: [composer]

volumes:
  nextcloud_dev:
